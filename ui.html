<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handy Markdown Viewer v__APP_VERSION__</title>
<style>
/* hidden 属性の要素は、必ず隠す。display を指定した規則（.frow { display: flex } など）が、hidden を打ち消して表示してしまうため
   （Ctrl+F の検索バーに、置換の行が出ていた）。要素ごとの [hidden] の規則は、これに任せる */
[hidden] { display: none !important; }
:root {
  --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --side: #f6f8fa;
  --border: #d0d7de; --accent: #0969da; --sel: #ddf4ff; --code: #f3f4f6;
  /* コードの色分け（```言語名）。ダークと印刷でも読める組み合わせ */
  --t-kw: #0033b3; --t-str: #067d17; --t-com: #5c6370; --t-num: #9c4a00; --t-fn: #6639ba; --t-bi: #0b6e99; --t-var: #a8350f; --t-del: #b3261e; --t-ins: #1a7f37;
  /* 表示フォント（フォントの設定で変わる。--head-font は設定したときだけ入る） */
  --ui-font: "Yu Gothic UI", "Segoe UI", sans-serif;
  --body-font: "Yu Gothic UI", "Segoe UI"; --body-size: 14px;
  --code-font: Consolas, "Cascadia Mono", monospace; --code-size: 13px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --side: #161b22;
    --border: #30363d; --accent: #58a6ff; --sel: #1f3a5f; --code: #1c2128;
    --t-kw: #ff7b72; --t-str: #a5d6ff; --t-com: #8b949e; --t-num: #79c0ff; --t-fn: #d2a8ff; --t-bi: #ffa657; --t-var: #ffb38a; --t-del: #ffa198; --t-ins: #7ee787;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
  font: 14px/1.5 var(--ui-font); }
#body { flex: 1; min-height: 0; display: flex; }
#side { width: 320px; min-width: 200px; background: var(--side);
  border-right: 1px solid var(--border); display: flex; flex-direction: column; }
#side.hidden { display: none; }
#toolbar { display: flex; flex-wrap: wrap; gap: 6px 0; align-items: center; padding: 8px 12px;
  background: var(--side); border-bottom: 1px solid var(--border); }
/* 窓を狭めたときは、グループ（区切り線で分けた塊）の境目で折り返す。ボタンの文字は折り返さない */
#toolbar .group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 6px; padding-right: 10px; margin-right: 10px;
  border-right: 1px solid var(--border); white-space: nowrap; }
#toolbar .group:last-child { border-right: 0; margin-right: 0; padding-right: 0; }
#toolbar button, #toolbar span { white-space: nowrap; }
#zoombox { display: inline-flex; align-items: center; gap: 4px; }
#zoombox button { padding: 6px 10px; min-width: 34px; }
#zoombox input { width: 64px; padding: 5px 4px; font: inherit; text-align: right;
  color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
#zoombox button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
#toolbar button { padding: 6px 14px; }
#toolbar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
#sBar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 6px 12px;
  background: var(--side); border-bottom: 1px solid var(--border); }
#sBar[hidden] { display: none; }
#sBar input[type=text] { flex: 1 1 220px; min-width: 140px; max-width: 420px; font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
#sBar input[type=text].bad { border-color: #cf222e; }
#sBar label { font-size: 12px; color: var(--muted); white-space: nowrap; }
#sBar button { white-space: nowrap; }
#sCount { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; }
#sCount.bad { color: #cf222e; }
mark.find-hit { background: rgba(255, 211, 61, .5); color: inherit; border-radius: 2px; }
mark.find-hit.cur { background: rgba(255, 150, 50, .85); outline: 2px solid #e8590c; }
#side h2 { margin: 0; padding: 8px 10px 0; font-size: 12px; color: var(--muted); font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
button { font: inherit; padding: 4px 10px; border: 1px solid var(--border);
  background: var(--bg); color: var(--fg); border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--accent); }
#folder { padding: 6px 10px; color: var(--muted); font-size: 12px;
  word-break: break-all; border-bottom: 1px solid var(--border); }
#filter { margin: 8px; padding: 5px 8px; font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
#count { padding: 0 10px 4px; color: var(--muted); font-size: 12px; }
#list { flex: 1; overflow-y: auto; }
.item { padding: 5px 10px; cursor: pointer; border-left: 3px solid transparent; }
.item:hover { background: var(--sel); }
.item.sel { background: var(--sel); border-left-color: var(--accent); }
/* 確認・知らせのダイアログ（書き出しの完了など） */
#veil { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 10; }
#veil.show { display: flex; }
#dlg { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; width: min(520px, 90vw); box-shadow: 0 8px 30px rgba(0,0,0,.3); }
#dlg h3 { margin: 0 0 8px; font-size: 16px; }
#dlg p { margin: 0 0 16px; color: var(--muted); white-space: pre-wrap; word-break: break-all; }
#dExtra:not(:empty) { margin: 0 0 16px; display: flex; flex-direction: column; gap: 10px; }
#dlg .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
/* 右クリックのメニュー（一覧のファイル） */
#ctx { position: fixed; z-index: 20; min-width: 200px; padding: 4px; background: var(--bg); color: var(--fg);
  border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.25); max-height: calc(100vh - 8px); overflow-y: auto; }
#ctx[hidden] { display: none; }
#ctx .citem { display: flex; justify-content: space-between; gap: 24px; width: 100%; border: 0; background: none; color: inherit; text-align: left; padding: 5px 10px; border-radius: 5px; font: inherit; cursor: pointer; }
#ctx .citem:hover:not(:disabled) { background: var(--sel); }
#ctx .ckey { color: var(--muted); font-size: 12px; }
/* フォルダー全体の検索（本文）: 「本文を探す」の切替と、結果の一覧 */
#bodyRow { display: flex; align-items: center; gap: 10px; padding: 6px 10px 0; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
#bodyRow label { white-space: nowrap; cursor: pointer; } #bodyRow span[hidden] { display: none; }
.shead { padding: 6px 10px 2px; font-weight: 600; font-size: 13px; cursor: pointer; word-break: break-all; border-top: 1px solid var(--border); }
.shead:first-child { border-top: 0; } .shead:hover { background: var(--sel); }
.shead .scnt { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
.shit { padding: 2px 10px 2px 14px; font-size: 12.5px; cursor: pointer; display: grid; grid-template-columns: 3.4em 1fr; gap: 6px; word-break: break-all; line-height: 1.45; }
.shit:hover { background: var(--sel); } .shit .sln { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.shit mark { background: rgba(255, 211, 61, .55); color: inherit; border-radius: 2px; padding: 0 1px; }
.smore { padding: 2px 10px 6px 14px; color: var(--muted); font-size: 12px; cursor: pointer; } .smore:hover { color: var(--fg); }
/* 一覧の階層表示（サブフォルダをアコーディオンで開閉） */
.dirrow { padding: 4px 10px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--fg); display: flex; align-items: baseline; gap: 4px; user-select: none; }
.dirrow:hover { background: var(--sel); }
.dirrow .chev { display: inline-block; width: 1em; color: var(--muted); flex: none; }
.dirrow .dname { word-break: break-all; }
.dirrow .dcnt { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: auto; padding-left: 6px; flex: none; }
#treeBtns { display: flex; gap: 6px; font-weight: 400; }
#treeBtns[hidden] { display: none; }
#treeBtns button { font-size: 11px; padding: 0 6px; }
.item .name { display: block; font-weight: 600; word-break: break-all; }
.item .dir { display: block; color: var(--muted); font-size: 12px; word-break: break-all; }
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#top { padding: 6px 12px; border-bottom: 1px solid var(--border);
  display: flex; gap: 8px; align-items: center; }
#navbtns { display: flex; gap: 4px; flex: none; }
#navbtns button { padding: 0 9px; font-size: 12px; line-height: 1.7; }
#title { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#scroll { flex: 1; overflow: auto; }
#content { padding: 24px 32px 64px; transform-origin: top left;
  font-family: var(--body-font), sans-serif; font-size: var(--body-size); }
#empty { color: var(--muted); text-align: center; margin-top: 20vh; }
#empty button { margin-top: 12px; padding: 8px 18px; }
#msg { color: #cf222e; padding: 8px 12px; }

#content h1, #content h2 { border-bottom: 1px solid var(--border); padding-bottom: .3em; }
#content h1, #content h2, #content h3, #content h4 { margin: 1.4em 0 .6em; line-height: 1.25; }
#content h1, #content h2, #content h3, #content h4, #content h5, #content h6 { font-family: var(--head-font, inherit); }
#content h1 { font-size: var(--h1-size, 2em); }
#content h2 { font-size: var(--h2-size, 1.5em); }
#content h3 { font-size: var(--h3-size, 1.17em); }
#content h4 { font-size: var(--h4-size, 1em); }
#content a { color: var(--accent); }
#content code { background: var(--code); padding: .15em .4em; border-radius: 4px;
  font: var(--code-size) var(--code-font); }
#content pre { background: var(--code); padding: 12px 16px; border-radius: 6px; overflow-x: auto; }
#content pre code { padding: 0; background: none; }
/* コードの色分け。色だけで区別する（太字・斜体にすると、日本語のコメントで字体が変わって読みにくい） */
#content .tok-k, #content .tok-kc, #content .tok-kd, #content .tok-kn, #content .tok-kp, #content .tok-kr, #content .tok-kt,
#content .tok-ow, #content .tok-nt, #content .tok-gh, #content .tok-gu { color: var(--t-kw); }
#content .tok-s, #content .tok-sa, #content .tok-sb, #content .tok-sc, #content .tok-dl, #content .tok-sd, #content .tok-s1,
#content .tok-s2, #content .tok-sh, #content .tok-si, #content .tok-sr, #content .tok-ss, #content .tok-sx { color: var(--t-str); }
#content .tok-c, #content .tok-ch, #content .tok-cm, #content .tok-cp, #content .tok-cpf, #content .tok-c1, #content .tok-cs,
#content .tok-gp { color: var(--t-com); }
#content .tok-m, #content .tok-mb, #content .tok-mf, #content .tok-mh, #content .tok-mi, #content .tok-mo, #content .tok-il,
#content .tok-se { color: var(--t-num); }
#content .tok-nf, #content .tok-fm, #content .tok-nc, #content .tok-nn, #content .tok-nd, #content .tok-ne { color: var(--t-fn); }
#content .tok-nb, #content .tok-bp, #content .tok-na, #content .tok-no, #content .tok-nl { color: var(--t-bi); }
#content .tok-nv, #content .tok-vc, #content .tok-vg, #content .tok-vi, #content .tok-vm { color: var(--t-var); }
#content .tok-gd { color: var(--t-del); }
#content .tok-gi { color: var(--t-ins); }
#content blockquote { margin: 0; padding: 0 1em; color: var(--muted);
  border-left: 4px solid var(--border); }
#content table { border-collapse: collapse; margin: 1em 0; }
#content th, #content td { border: 1px solid var(--border); padding: 6px 12px; }
#content th { background: var(--side); }
#content pre.mermaid-src { background: none; padding: 0; }
#content .diagram { text-align: center; overflow-x: auto; margin: 1em 0; }
#content .diagram svg { max-width: 100%; height: auto; }
#content .diagram.vega { background: #fff; border-radius: 6px; padding: 8px 0; }
#content .diagram-error { border: 1px solid #cf222e; border-radius: 6px; padding: 8px 12px; margin: 1em 0; }
#content .diagram-error p { margin: 0 0 6px; color: #cf222e; }
/* 数式（KaTeX）。独立した行の数式は、中央に置き、長いときは横へスクロールする */
#content .math.block { text-align: center; overflow-x: auto; overflow-y: hidden; margin: 1em 0; }
#content .math.block .katex-display { margin: .3em 0; }
#content .math-error { color: #cf222e; }
#content .math-error code { color: inherit; background: none; padding: 0; white-space: pre-wrap; }
#content .math.block.math-error { border: 1px solid #cf222e; border-radius: 6px; padding: 8px 12px; text-align: left; }
#content .math-error-msg { margin-top: 6px; font-size: .9em; }
/* 数式の中の日本語（	ext{確率} など）。KaTeX は、日本語を <span class="cjk_fallback"> で包むが、その CSS は無く、
   親の指定（KaTeX_Main → Times New Roman → serif）をたどって、システムの代替フォントが使われる。
   PDF では、これが Type3 フォントになり、Acrobat Reader で警告が出る。本文と同じ、埋め込める日本語フォントを指定する */
#content .katex .cjk_fallback { font-family: "Yu Gothic UI", "Meiryo", "MS Gothic"; }

/* フォントの設定ダイアログ */
#fveil { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
#fveil[hidden] { display: none; }
#fdlg { background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px; width: fit-content; max-width: 94vw; max-height: 90vh; overflow: auto; font: 14px/1.5 "Yu Gothic UI", "Segoe UI", sans-serif; }
#fdlg h3 { margin: 0 0 6px; }
#fdlg .hint { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
#fdlg .hint { max-width: 520px; }
#ftable { border-collapse: collapse; width: auto; }
#ftable th { text-align: left; padding: 6px 12px 6px 0; white-space: nowrap; font-weight: 600; }
#ftable td { padding: 4px 8px 4px 0; vertical-align: middle; white-space: nowrap; }
#ftable td button { padding: 4px 8px; font-size: 12px; }
#ftable input[type=text] { padding: 5px 8px; font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
#ftable input[list] { width: 150px; margin-right: 6px; }
.numbox { display: inline-flex; align-items: stretch; margin: 0 2px; vertical-align: middle; }
.numbox input { width: 46px; text-align: right; border-top-right-radius: 0; border-bottom-right-radius: 0; margin: 0; }
.numbox .arrows { display: flex; flex-direction: column; width: 18px; }
/* 「#ftable td button」より優先させる（余白と文字の大きさで、入力欄より背が高くならないように） */
#ftable .numbox .arrows button { flex: 1 1 0; min-height: 0; height: 0; padding: 0; margin: 0; font-size: 8px; line-height: 1;
  border-radius: 0; border-left: 0; overflow: hidden; }
#ftable .numbox .arrows button:first-child { border-top-right-radius: 6px; }
#ftable .numbox .arrows button:last-child { border-bottom-right-radius: 6px; border-top: 0; }
@media (max-width: 640px) { #ftable td:last-child:not([colspan]) { display: none; } }
#fdlg .row { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
#fdlg .grow { flex: 1; }
#fdlg button.primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 6px 18px; }
#content img { max-width: 100%; }
#content hr { border: 0; border-top: 1px solid var(--border); }
#content li.task-list-item { list-style: none; margin-left: -1.4em; }

/* 印刷・PDF: 画面の部品を隠し、本文だけを紙に流す */
@media print {
  :root { --bg: #fff; --fg: #000; --muted: #444; --side: #f2f2f2; --border: #999; --accent: #0645ad; --code: #f2f2f2;
    --t-kw: #0033b3; --t-str: #067d17; --t-com: #5c6370; --t-num: #9c4a00; --t-fn: #6639ba; --t-bi: #0b6e99; --t-var: #a8350f; --t-del: #b3261e; --t-ins: #1a7f37; }
  html, body { height: auto !important; overflow: visible !important; display: block !important;
    background: #fff !important; color: #000 !important; }
  #toolbar, #msg, #ctx, #veil, #side, #top, #sBar, #pveil, #fveil { display: none !important; }
  mark.find-hit { background: none !important; color: inherit !important; outline: 0 !important; }
  #body, #main, #scroll { display: block !important; overflow: visible !important; height: auto !important;
    width: auto !important; flex: none !important; min-height: 0 !important; }
  #content { zoom: 1 !important; padding: 0 !important; }
  /* 本文の文字を、PDF で正しく埋め込める形で出す（Acrobat Reader の警告「埋め込みフォント T3Font_n を抽出できません」の対策）。
     ・絵文字は、そのままだとカラー絵文字になり、PDF では Type3 フォントとして埋め込まれる。文字として描く（font-variant-emoji）
     ・本文のフォントに字形が無い記号（▦ など）は、システムの代替フォントが使われ、これも Type3 になる。
       埋め込める日本語フォント（メイリオ、MS ゴシック）を、総称名（sans-serif）より前に足しておく */
  #content { font-family: var(--body-font), "Meiryo", "MS Gothic", sans-serif; font-variant-emoji: text; }
  #content h1, #content h2, #content h3, #content h4, #content h5, #content h6 { break-after: avoid; }
  #content tr, #content img, #content .diagram, #content blockquote, #content li { break-inside: avoid; }
  #content thead { display: table-header-group; }
  #content pre { white-space: pre-wrap; word-break: break-all; overflow: visible; break-inside: avoid; }
  /* コードの中の記号（✓ など）が PDF で Type3 フォントになるのを防ぐ。
     ・既定のコード用フォント（Consolas, "Cascadia Mono", monospace）の Cascadia Mono は可変フォントで、PDF では Type3 になる。
       Consolas に無い字（✓ など）を Cascadia Mono が描くため、印刷のときだけ既定から外す（フォント設定で選んだフォントは、そのまま使う）
     ・字形が無い記号は、本文と同じく、埋め込める日本語フォントで補う
     ・font の短縮記法が、絵文字の指定（font-variant-emoji）を戻してしまうので、ここで指定し直す */
  :root { --code-font: Consolas; }
  #content code, #content pre { font-family: var(--code-font), "Yu Gothic UI", "Segoe UI", "Meiryo", "MS Gothic"; font-variant-emoji: text; }
  #content .diagram { overflow: visible; }
  #content .math.block { overflow: visible; break-inside: avoid; }
  #content .page-break, #content .pagebreak { break-after: page; height: 0 !important; margin: 0 !important; border: 0 !important; overflow: hidden; }
  #content .page-break-before { break-before: page; }
  #content .page-break-after { break-after: page; }
  #content .page-break-avoid { break-inside: avoid; }
}
</style>
</head>
<body>
<div id="toolbar">
  <span class="group">
    <button id="btnFolder" class="primary" title="Ctrl+O">📁 フォルダーを開く</button>
    <button id="btnFile" title="Ctrl+Shift+O">📄 ファイルを開く</button>
  </span>
  <span class="group">
    <button id="btnSide" title="Ctrl+B">☰ 一覧を隠す</button>
    <button id="btnReload" title="F5">↻ 更新</button>
    <button id="btnAuto" title="開いているファイルが他のアプリで保存されたら、表示を自動で更新します">⟳ 自動更新</button>
    <button id="btnFind" title="Ctrl+F">🔍 検索</button>
  </span>
  <span class="group">
    <button id="btnPrint" title="Ctrl+P">🖨 印刷／PDF</button>
    <button id="btnHtml" title="いま表示している文書を、1つで完結する HTML ファイルに書き出す（図・グラフ・数式も入ります）">🌐 HTML</button>
    <button id="btnFont" title="表示フォントの名前・大きさを設定する">🔤 フォント</button>
  </span>
  <span id="zoombox" class="group">
    <span>表示倍率</span>
    <button id="zOut" title="縮小 (Ctrl+−)">−</button>
    <input id="zVal" type="number" min="10" max="500" step="5" value="100" title="倍率(%)を直接入力">%
    <button id="zIn" title="拡大 (Ctrl++)">＋</button>
    <button id="z100" title="等倍 (Ctrl+0)">100%</button>
    <button id="zFit" title="横幅いっぱいに収める (Ctrl+9)">↔ 全体表示</button>
  </span>
</div>
<div id="msg" hidden></div>
<div id="ctx" hidden></div>
<div id="veil"><div id="dlg"><h3 id="dTitle"></h3><p id="dText"></p><div id="dExtra"></div><div class="btns" id="dBtns"></div></div></div>
<div id="body">
<aside id="side">

<script>
let api = null, folder = null, files = [], current = null;
const $ = id => document.getElementById(id);

function toggleSide() {
  const h = $('side').classList.toggle('hidden');
  $('btnSide').textContent = h ? '☰ 一覧を表示' : '☰ 一覧を隠す';
  savePrefsSoon();
}

function showEmpty() {
  if (current) return;
  const e = $('empty');
  if (!folder) e.innerHTML = '<p><b>Handy Markdown Viewer</b> <span style="color:var(--muted)">v__APP_VERSION__</span></p><p>上の「フォルダーを開く」で、読みたいファイルのあるフォルダーを選んでください。<br>一覧からファイルを選ぶと、ここに表示されます。</p><p>1つだけ読むときは「ファイルを開く」です。</p>';
  else if (files.length) e.innerHTML = '<p>← 左の一覧から、読みたいファイルを選んでください。</p>';
  else e.innerHTML = '<p>このフォルダーには Markdown ファイルがありません。</p><p>別のフォルダーを選ぶには「フォルダーを開く」を押してください。</p>';
}

function showMsg(t) { const m = $('msg'); m.textContent = t || ''; m.hidden = !t; m.style.color = ''; }   // 通知（note）の灰色を、エラーに引き継がない

// ---- 一覧の階層表示: フォルダ行（▸／▾）を押すと、そのフォルダの中を開閉する
// 初めは、直下のフォルダだけ開く（深いものは閉じる）。開いたファイルのあるフォルダは、そのファイルを開いたときに自動で開く
// （そのあと自分で閉じたものは、閉じたまま）。絞り込み中は、これまでどおり、平らに並べる。
const tree = { root: null, open: new Map(), sopen: new Map(), revealed: null, smode: '', search: false, paths: [] };
function buildTree(items) {                         // items: [{ rel, ... }]
  const root = { dirs: new Map(), files: [], count: 0 };
  for (const it of items) {
    const parts = it.rel.split('/'), name = parts.pop();
    let node = root, path = ''; node.count++;
    for (const p of parts) {
      path = path ? path + '/' + p : p;
      if (!node.dirs.has(p)) node.dirs.set(p, { name: p, path, dirs: new Map(), files: [], count: 0 });
      node = node.dirs.get(p); node.count++;
    }
    node.files.push({ ...it, name });
  }
  return root;
}
// 通常の一覧は、初めはすべて閉じる（開いた文書のフォルダだけ開く）。絞り込み・本文検索の結果は、初めはすべて開く（どのフォルダの文書かを見せるため）。
const treeIsOpen = path => tree.search ? (tree.sopen.has(path) ? tree.sopen.get(path) : true) : tree.open.get(path) === true;
const treeMap = () => tree.search ? tree.sopen : tree.open;
function treeDirPaths(rels) {
  const s = new Set();
  for (const rel of rels) { const parts = rel.split('/'); parts.pop(); let p = ''; for (const x of parts) { p = p ? p + '/' + x : x; s.add(p); } }
  return [...s];
}
function treeRevealCurrent() {
  const cur = current;
  if (!cur || !folder || !cur.toLowerCase().startsWith(folder.toLowerCase() + '\\')) return;
  const rel = cur.slice(folder.length + 1).replace(/\\/g, '/');
  if (rel === tree.revealed) return;
  tree.revealed = rel;
  const parts = rel.split('/'); parts.pop();
  let p = ''; for (const x of parts) { p = p ? p + '/' + x : x; tree.open.set(p, true); }
}
// 一覧の見せ方（mode: ''=通常、'f'=名前の絞り込み、'b'=本文検索）を決める。見せ方が変わったら、結果の開閉は初めに戻す
function treeSetup(mode, rels) {
  tree.search = mode !== '';
  if (tree.smode !== mode) { tree.sopen.clear(); tree.smode = mode; }
  tree.paths = treeDirPaths(rels);
  $('treeBtns').hidden = !tree.paths.length;
}
// 各フォルダの中は、サブフォルダが先、ファイルが後（エクスプローラと同じ）。leaf は、ファイルの行（本文検索では、一致の行も）を作る
function renderTreeNode(list, node, depth, leaf) {
  const dirs = [...node.dirs.values()].sort((a, b) => a.name.localeCompare(b.name, 'ja', { numeric: true }));
  for (const d of dirs) {
    const open = treeIsOpen(d.path);
    const row = document.createElement('div'); row.className = 'dirrow';
    row.setAttribute('role', 'treeitem'); row.setAttribute('aria-expanded', open ? 'true' : 'false');
    row.style.paddingLeft = (8 + depth * 14) + 'px'; row.dataset.dir = d.path; row.title = d.path;
    const ch = document.createElement('span'); ch.className = 'chev'; ch.textContent = open ? '▾' : '▸';
    const nm = document.createElement('span'); nm.className = 'dname'; nm.textContent = '📁 ' + d.name;
    const ct = document.createElement('span'); ct.className = 'dcnt'; ct.textContent = d.count;
    row.append(ch, nm, ct);
    row.onclick = () => { treeMap().set(d.path, !open); renderList(); };
    list.appendChild(row);
    if (open) renderTreeNode(list, d, depth + 1, leaf);
  }
  for (const f of node.files) leaf(list, f, depth);
}
function fileItem(rel, label, showDir, indent) {
  const div = document.createElement('div');
  div.className = 'item' + (current === folder + '\\' + rel.replace(/\//g, '\\') ? ' sel' : '');
  div.dataset.rel = rel;
  if (indent) div.style.paddingLeft = indent + 'px';
  const name = document.createElement('span'); name.className = 'name'; name.textContent = label;
  div.appendChild(name);
  const i = rel.lastIndexOf('/');
  if (showDir && i >= 0) { const dir = document.createElement('span'); dir.className = 'dir'; dir.textContent = rel.slice(0, i); div.appendChild(dir); }
  const full = folder + '\\' + rel.replace(/\//g, '\\');
  div.onclick = e => (e.ctrlKey || e.metaKey) ? openInNewWindow(full) : openFile(full);          // Ctrl+クリック: 新しいウィンドウで開く
  div.addEventListener('mousedown', e => { if (e.button === 1) e.preventDefault(); });          // 中クリックの、自動スクロールを止める
  div.addEventListener('auxclick', e => { if (e.button === 1) { e.preventDefault(); openInNewWindow(full); } });
  div.addEventListener('contextmenu', e => {
    e.preventDefault();
    showCtx(e.clientX, e.clientY, [{ label: '開く', run: () => openFile(full) }, { label: '新しいウィンドウで開く', key: 'Ctrl+クリック', run: () => openInNewWindow(full) }]);
  });
  return div;
}
$('treeOpen').onclick = () => { const m = treeMap(); for (const p of tree.paths) m.set(p, true); renderList(); };
$('treeClose').onclick = () => { const m = treeMap(); for (const p of tree.paths) m.set(p, false); renderList(); };
function renderList() {
  if (tree.root !== folder) { tree.root = folder; tree.open.clear(); tree.sopen.clear(); tree.revealed = null; }
  if (bodyOn()) { renderBodyResults(); return; }
  const q = $('filter').value.trim().toLowerCase();
  const shown = files.filter(f => f.toLowerCase().includes(q));
  $('count').textContent = folder ? `${shown.length} / ${files.length} 件${listTruncated ? '（途中までです）' : ''}` : '';
  $('count').style.color = listTruncated ? '#cf222e' : '';
  $('count').title = listTruncated ? '大きなフォルダーなので、一覧は途中までです。もっと下のフォルダーを選ぶと、全部を出せます' : '';
  const list = $('list'); list.textContent = '';
  treeSetup(q ? 'f' : '', shown);
  if (!q) treeRevealCurrent();
  renderTreeNode(list, buildTree(shown.map(rel => ({ rel }))), 0, (l, f, depth) => l.appendChild(fileItem(f.rel, f.name, false, 10 + depth * 14)));
}

let listTruncated = false;      // 一覧が、時間か件数の上限で途中までのとき true
async function loadFolder(path, keepFile) {
  $('count').textContent = '一覧を読み込んでいます…'; $('count').style.color = '';
  const r = await api.list_files(path);
  if (r.error) { showMsg(r.error); return; }
  showMsg('');
  folder = path; files = r.files; listTruncated = !!r.truncated;
  $('folder').textContent = path;
  $('filter').value = '';
  renderList();
  showEmpty();
}

let mermaidReady = null, diagramSeq = 0;
function loadMermaid() {
  if (!mermaidReady) mermaidReady = api.get_mermaid().then(async src => {
    const s = document.createElement('script'); s.textContent = src;
    document.head.appendChild(s);
    window.mermaid.initialize(mermaidConfig());
    // Architecture Diagram の追加アイコン。同梱のアイコン集を、使われたときだけ読み込む
    const packs = await api.list_icon_packs();
    if (packs.length) window.mermaid.registerIconPacks(packs.map(name => ({ name, loader: () => api.get_icon_pack(name).then(t => JSON.parse(t)) })));
    return window.mermaid;
  });
  return mermaidReady;
}

// ---- 数式（KaTeX）。```math、$$ ... $$、文中の $...$ は、Python が <div|span class="math"> に包んで渡す
let katexReady = null;
function loadKatex() {
  if (!katexReady) katexReady = (async () => {
    const a = await api.get_katex();
    const st = document.createElement('style'); st.textContent = a.css; document.head.appendChild(st);
    const s = document.createElement('script'); s.textContent = a.js; document.head.appendChild(s);
    return window.katex;
  })();
  return katexReady;
}

// root の中の数式を組む。TeX の誤りは、その位置に、原文と理由を見せる
function typesetMath(root, katex) {
  root.querySelectorAll('.math:not(.typeset)').forEach(el => {
    const tex = el.textContent, display = el.classList.contains('block');
    el.classList.add('typeset');
    try {
      katex.render(tex, el, { displayMode: display, throwOnError: true, output: 'html', strict: 'ignore', trust: false });
    } catch (e) {
      const why = String((e && (e.rawMessage || e.message)) || e).split('\n')[0];
      el.classList.add('math-error');
      el.textContent = '';
      const code = document.createElement('code'); code.textContent = (display ? '$$ ' : '$') + tex.trim() + (display ? ' $$' : '$');
      el.appendChild(code);
      const msg = document.createElement('div'); msg.className = 'math-error-msg'; msg.textContent = '数式を組めませんでした: ' + why;
      if (display) el.appendChild(msg); else el.title = msg.textContent;
    }
  });
}

async function renderMath(path) {
  if (!document.querySelector('#content .math:not(.typeset)')) return;
  let katex;
  try { katex = await loadKatex(); }
  catch (e) { katexReady = null; showMsg('数式の描画部品を読み込めませんでした: ' + e); return; }
  if (current !== path) return;                 // 別の文書へ移ったら打ち切る
  typesetMath($('content'), katex);
}

async function renderDiagrams(path) {
  const blocks = [...document.querySelectorAll('#content pre.mermaid-src')];
  if (!blocks.length) return;
  let mermaid;
  try { mermaid = await loadMermaid(); }
  catch (e) { mermaidReady = null; showMsg('図の描画部品を読み込めませんでした: ' + e); return; }
  for (const pre of blocks) {
    if (current !== path) return;               // 別の文書へ移ったら打ち切る
    const code = pre.textContent, id = 'mmd' + (++diagramSeq);
    // 本文の中の本当の置き場所で描く。ガントは「親要素の幅」で全体の幅を決めるため、
    // 画面外の作業用要素で描くとウィンドウ全幅で作られ、本文幅へ縮小されて文字が小さくなる
    const div = document.createElement('div'); div.className = 'diagram'; div.dataset.src = code;
    pre.replaceWith(div);
    try {
      const { svg } = await mermaid.render(id, code, div);
      div.innerHTML = svg;
    } catch (e) {
      document.getElementById('d' + id)?.remove();   // 失敗時に残る作業用の要素
      const box = document.createElement('div'); box.className = 'diagram-error';
      const p = document.createElement('p');
      p.textContent = '図を描けませんでした: ' + String(e.message || e).split('\n')[0];
      box.appendChild(p); div.replaceWith(box); box.appendChild(pre);
      pre.style.display = 'block';
    }
  }
}

// ---- Vega-Lite
let vegaReady = null;
function loadVega() {
  if (!vegaReady) vegaReady = (async () => {
    for (const name of ['vega', 'vega-lite', 'vega-embed']) {   // この順に読み込む
      const src = await api.get_vendor(name);
      const s = document.createElement('script'); s.textContent = src;
      document.head.appendChild(s);
    }
    return window.vegaEmbed;
  })();
  return vegaReady;
}

async function renderVega(path) {
  const blocks = [...document.querySelectorAll('#content pre > code.language-vega-lite, #content pre > code.language-vegalite')]
    .map(c => c.parentElement);
  if (!blocks.length) return;
  let embed;
  try { embed = await loadVega(); }
  catch (e) { vegaReady = null; showMsg('Vega-Lite の描画部品を読み込めませんでした: ' + e); return; }
  // 文書内の spec による外部データ（data.url）の扱い:
  //   http(s)  … ネットから取得
  //   相対パス … 文書のフォルダーとその下の .csv/.tsv/.json だけ（Python 側で検査して読む）
  //   それ以外 … 拒否
  const loader = window.vega.loader();
  const baseLoad = loader.load;
  loader.load = async (uri, options) => {
    const u = String(uri).trim();
    if (/^https?:\/\//i.test(u)) return baseLoad.call(loader, u, options);
    const r = await api.read_data(u);
    if (r.error) throw new Error(r.error);
    return r.text;
  };
  for (const pre of blocks) {
    if (current !== path) return;
    const text = pre.textContent;
    const div = document.createElement('div'); div.className = 'diagram vega';
    pre.replaceWith(div);
    try {
      const spec = JSON.parse(text);
      await embed(div, spec, { renderer: 'svg', actions: false, loader, config: vegaConfig() });
    } catch (e) {
      const box = document.createElement('div'); box.className = 'diagram-error';
      const p = document.createElement('p');
      p.textContent = 'グラフを描けませんでした: ' + String(e.message || e).split('\n')[0];
      box.appendChild(p); div.replaceWith(box); box.appendChild(pre);
      pre.style.display = 'block';
    }
  }
}

// ---- 印刷・PDF
// 暗い配色の図は紙では読めないので、ダイアログが開いている間だけ明るい配色で描き直す
async function printBeforeDiagrams() {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const nodes = [...document.querySelectorAll('#content .diagram[data-src]')];
  if (!dark || !nodes.length || !window.mermaid) return null;
  const redraw = async theme => {
    window.mermaid.initialize(mermaidConfig(theme));
    for (const d of nodes) {
      try { const { svg } = await window.mermaid.render('mmd' + (++diagramSeq), d.dataset.src, d); d.innerHTML = svg; } catch (e) { /* そのまま */ }
    }
  };
  await redraw('default');
  return () => redraw('dark');
}
const fileName = () => current ? current.substring(current.lastIndexOf('\\') + 1) : '';
function openPrint() { MdPrint.open(); }

// 文書を開いている間（数式・図・グラフの描画を含む）は、openBusy が 0 でない。HTML の書き出しが、終わるまで待つために使う
let openBusy = 0;
async function openFile(path, keepScroll, restore) {
  openBusy++;
  try { return await openFileInner(path, keepScroll, restore); } finally { openBusy--; }
}
async function openFileInner(path, keepScroll, restore) {
  navSaveScroll();                         // 離れる文書の、読んでいた位置を覚える
  const keep = keepScroll ? { top: $('scroll').scrollTop, left: $('scroll').scrollLeft } : null;   // 自動更新では、読んでいる位置を保つ
  const r = await api.open_file(path);
  if (r.error) { showMsg(r.error); return 'error'; }
  showMsg('');
  current = r.path; curStamp = r.stamp; watchPending = null; watchMissing = false;
  if (!keepScroll && !nav.busy) navPush(r.path);
  $('content').innerHTML = r.html;
  $('title').textContent = r.path;
  $('scroll').scrollTop = keep ? keep.top : 0;
  $('scroll').scrollLeft = keep ? keep.left : 0;
  renderList();
  const sel = document.querySelector('.item.sel');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
  if (fitMode) fitWidth();
  await renderMath(r.path);
  await renderDiagrams(r.path);
  await renderVega(r.path);
  if (fitMode) fitWidth();           // 図が出来て幅が変わるので、もう一度合わせる
  if (keep) { $('scroll').scrollTop = keep.top; $('scroll').scrollLeft = keep.left; }   // 数式や図で高さが変わるので、描き終えてからも戻す
  if (restore) { $('scroll').scrollTop = restore.top; $('scroll').scrollLeft = restore.left; }   // 戻る・進むでは、前に読んでいた位置へ
  if (finder.isOpen()) finder.refresh(true);
  return true;
}

// ---- 戻る・進む: 開いたファイル（リンクをたどった先・一覧から開いたもの）の履歴。各項目に、読んでいた位置も保つ
// 自動更新・読み直し・同じファイルを開き直すだけのときは、履歴を増やさない。途中へ戻ってから別のファイルを開くと、「進む」側は捨てる。
const nav = { list: [], idx: -1, busy: false, detached: false };
const NAV_MAX = 100;
const navName = p => p.substring(p.lastIndexOf('\\') + 1);
function navSaveScroll() {
  const e = nav.list[nav.idx];
  if (e && !nav.detached) { const s = { top: $('scroll').scrollTop, left: $('scroll').scrollLeft }; e.top = s.top; e.left = s.left; }
}
function navPush(path) {
  const cur = nav.list[nav.idx];
  if (!nav.detached && cur && cur.path.toLowerCase() === path.toLowerCase()) return;
  nav.list = nav.list.slice(0, nav.idx + 1);
  nav.list.push({ path, top: 0, left: 0 });
  if (nav.list.length > NAV_MAX) nav.list.shift();
  nav.idx = nav.list.length - 1; nav.detached = false; navUpdate();
}
function navTarget(delta) {
  if (nav.detached) return delta < 0 && nav.idx >= 0 ? nav.idx : -1;      // 「無題」にいるときは、直前の文書へ戻る
  const t = nav.idx + delta;
  return t >= 0 && t < nav.list.length ? t : -1;
}
function navUpdate() {
  const b = navTarget(-1), f = navTarget(1);
  $('btnBack').disabled = b < 0; $('btnFwd').disabled = f < 0;
  $('btnBack').title = b >= 0 ? `戻る: ${navName(nav.list[b].path)} (Alt+←)` : '戻る (Alt+←)';
  $('btnFwd').title = f >= 0 ? `進む: ${navName(nav.list[f].path)} (Alt+→)` : '進む (Alt+→)';
}
function navReset() { nav.list = []; nav.idx = -1; nav.detached = false; navUpdate(); }
async function navGo(delta) {
  const t = navTarget(delta);
  if (t < 0 || nav.busy) return;
  navSaveScroll();
  const e = nav.list[t];
  nav.busy = true;
  try {
    const r = await navOpen(e.path, e);
    if (r === true) { nav.idx = t; nav.detached = false; }
    else if (r === 'error') {                                   // 消された・開けない。履歴から外す
      nav.list.splice(t, 1);
      if (t <= nav.idx) nav.idx--;
    }
  } finally { nav.busy = false; navUpdate(); }
}
$('btnBack').onclick = () => navGo(-1);
$('btnFwd').onclick = () => navGo(1);
navUpdate();
async function navOpen(p, e) {                     // 別のフォルダーの文書なら、そのフォルダーへ移ってから開く
  if (!folder || !p.toLowerCase().startsWith(folder.toLowerCase() + '\\')) await loadFolder(p.substring(0, p.lastIndexOf('\\')), true);
  return openFile(p, false, e);
}

// 開いている文書を閉じて、空白の表示に戻す
async function closeDocument() {
  current = null; navReset();
  $('content').innerHTML = '<div id="empty"></div>';
  $('title').textContent = '';
  $('scroll').scrollTop = 0;
  $('scroll').scrollLeft = 0;
  if (finder.isOpen()) finder.refresh(false);

const samePath = (a, b) => !!a && !!b && a.replace(/[\\/]+$/, '').toLowerCase() === b.replace(/[\\/]+$/, '').toLowerCase();

// 別のフォルダーへ移る。開いていた文書は、そのフォルダーのものではなくなるので閉じる（同じフォルダーなら一覧を取り直すだけ）
async function switchFolder(p) {
  if (samePath(p, folder)) { await loadFolder(p, true); return; }
  if (current) await closeDocument();
  await loadFolder(p, false);
}

async function chooseFolder() {
  const p = await api.pick_folder(folder);
  if (p) await switchFolder(p);
  return p;
}

async function chooseFile() {
  const p = await api.pick_file(folder);
  if (!p) return;
  const dir = p.substring(0, p.lastIndexOf('\\'));
  if (dir !== folder) await loadFolder(dir, true);
  await openFile(p);
}

// ドロップを受けるには、dragover の既定の動作を止める。Python には送らない（ドラッグ中に大量に出るため。filedrop.py を参照）
document.addEventListener('dragover', e => e.preventDefault());

// ウィンドウへのドロップ。Python（filedrop.py）が、開くと決まった対象（Markdown ファイル1つ／フォルダー1つ）だけを渡してくる
async function handleDrop(kind, path) {
  if (MdPrint.isOpen() || fontDlgOpen()) return;
  if (kind === 'folder') { await switchFolder(path); return; }
  const dir = path.substring(0, path.lastIndexOf('\\'));
  if (!samePath(dir, folder)) await loadFolder(dir, true);
  await openFile(path);
}

async function reload() {
  if (!folder && !current) return;
  if (folder) await loadFolder(folder, true);
  if (current) await openFile(current);
}

$('content').addEventListener('click', async e => {
  const a = e.target.closest('a'); if (!a) return;
  const href = a.getAttribute('href') || '';
  e.preventDefault();
  if (href.startsWith('#')) {
    const t = document.getElementById(decodeURIComponent(href.slice(1)));
    if (t) t.scrollIntoView();
  } else if (/^(https?:|mailto:)/i.test(href)) {
    api.open_external(href);
  } else if (current) {
    const p = await api.resolve_link(current, href);
    if (p) { if (e.ctrlKey || e.metaKey) await openInNewWindow(p); else await openFile(p); }          // Ctrl+クリック: 新しいウィンドウで開く
    else {
      // Markdown 以外（PDF・Word など）は、関連づけられたアプリで開く
      const r = await api.open_local(current, href);
      if (r && r.error) showMsg(r.error);
    }
  }
});

// 結果の行を開く。ファイルを開いて、本文の中を同じ語で探し、その行の最初の一致へ移る（ハイライトも付く）。line が無ければ、ファイルを開くだけ

async function openHit(rel, hit) {

  if (!current || current.toLowerCase() !== full.toLowerCase()) await openFile(full);
  if (!hit || !current) return;
  const o = bsearch.opts || bodyOpts();
  $('sq').value = o.q; $('sCase').checked = !!o.cs; $('sRegex').checked = !!o.re;
  finder.open(); bsearch.hitOpened = true;
  const n = finder.count();
  if (!n) { const t = [...document.querySelectorAll('#content [data-line]')].filter(e => parseInt(e.dataset.line, 10) <= hit.line).pop(); if (t) t.scrollIntoView({ block: 'center' }); return; }
  if (n > 400) return;                                   // 多すぎるときは、最初の一致のまま
  const lines = [];
  for (let i = 0; i < n; i++) {                           // 一致を順にたどって、含まれているブロックの行を集める
    const cur = document.querySelector('#content mark.find-hit.cur');
    lines.push(cur ? blockLineOf(cur) : -1);
    if (i < n - 1) finder.step(1);
  }
  const upto = lines.filter(l => l <= hit.line);
  const block = upto.length ? Math.max(...upto) : lines[0];
  const best = Math.max(0, lines.indexOf(block));         // その行のブロックの、最初の一致
  while (finder.current() !== best) finder.step(finder.current() > best ? -1 : 1);
}

document.addEventListener('keydown', e => {
  if (fontDlgOpen()) { if (e.key === 'Escape') closeFontDlg(); return; }
  if (MdPrint.isOpen()) return;
  if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'f') { e.preventDefault(); finder.open(); return; }
  if (e.key === 'F3') { e.preventDefault(); if (!finder.isOpen()) finder.open(); else finder.step(e.shiftKey ? -1 : 1); return; }
  if (e.key === 'Escape' && finder.isOpen()) { e.preventDefault(); finder.close(); return; }
  if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 'p') { e.preventDefault(); openPrint(); return; }
  if (e.ctrlKey && !e.shiftKey && (e.key === '+' || e.key === '=' || e.key === ';')) { e.preventDefault(); zoomBy(1.1); return; }
  if (e.ctrlKey && (e.key === '-' || e.key === '_')) { e.preventDefault(); zoomBy(1 / 1.1); return; }
  if (e.ctrlKey && e.key === '0') { e.preventDefault(); setZoom(1, false); return; }
  if (e.ctrlKey && e.key === '9') { e.preventDefault(); fitWidth(); return; }
  if (e.key === 'Escape' && !$('ctx').hidden) { e.preventDefault(); hideCtx(); return; }
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'n') { e.preventDefault(); openInNewWindow(current || folder); return; }          // 新しいウィンドウ（いまの文書・フォルダーを引き継ぐ）
  if (e.altKey && !e.ctrlKey && !e.shiftKey && e.key === 'ArrowLeft') { e.preventDefault(); navGo(-1); return; }
  if (e.altKey && !e.ctrlKey && !e.shiftKey && e.key === 'ArrowRight') { e.preventDefault(); navGo(1); return; }
  if (e.key === 'F5') { e.preventDefault(); reload(); }
  else if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'o') { e.preventDefault(); chooseFile(); }
  else if (e.ctrlKey && e.key.toLowerCase() === 'o') { e.preventDefault(); chooseFolder(); }

let prefs = { fonts: {}, zoom: null, side_hidden: false }, prefsReady = false, prefsTimer = null;
const FONT_PARTS = {

  body:    { label: '本文',                     family: '"Yu Gothic UI", "Segoe UI", sans-serif', size: 14, min: 8, max: 60 },

const GENERIC_FONTS = new Set(['serif', 'sans-serif', 'monospace', 'cursive', 'fantasy', 'system-ui', 'ui-serif', 'ui-sans-serif', 'ui-monospace']);
function cssFamily(s) {                 // 入力されたフォント名を、CSS に安全に入れられる形にする
  if (!s) return '';

  if (!n) return '';

const fontPref = part => (prefs.fonts && prefs.fonts[part]) || {};

// 図・グラフの文字の後ろに必ず足す、日本語の字形を持つフォント。指定のフォントに日本語の字形が無いと、ブラウザーが
// システムの代替フォントを使い、PDF に Type3 フォントとして埋め込まれる。Acrobat Reader は、それを開くときに

const DIAGRAM_JP_FONTS = '"Yu Gothic UI", "Meiryo"';
function mermaidConfig(theme) {         // 既定値も毎回すべて渡す（前の設定が残らないように）
  const d = fontPref('diagram'), size = d.size || FONT_PARTS.diagram.size;
  const fam = (cssFamily(d.family) || '"trebuchet ms", verdana, arial') + ', ' + DIAGRAM_JP_FONTS + ', sans-serif';
  const k = size / FONT_PARTS.diagram.size;

}
function vegaConfig() {
  // 軸・凡例・タイトル・見出し・文字の各部分に、名前と大きさを渡す（Vega-Lite の既定の大きさに、Mermaid と同じ倍率を掛ける）。

function refreshSamples() {

    const el = document.querySelector(`[data-sample="${part}"]`); if (!el) continue;
    const spec = FONT_PARTS[part], p = fontPref(part);

function makeNumberBox(opts) {          // opts: { part, kind, level, min, max, value, dflt(): 既定の数, placeholder, title }
  const wrap = document.createElement('span'); wrap.className = 'numbox';
  const inp = document.createElement('input');
  inp.type = 'text'; inp.inputMode = 'numeric'; inp.autocomplete = 'off';
  inp.value = opts.value || ''; inp.placeholder = opts.placeholder || '';
  if (opts.title) inp.title = opts.title;
  inp.dataset.part = opts.part; inp.dataset.kind = opts.kind;
  if (opts.level) inp.dataset.level = opts.level;

    fam.addEventListener('blur', () => {
      if (!fam.value && fam.dataset.keep) fam.value = fam.dataset.keep;
      delete fam.dataset.keep; fam.placeholder = dflt;
    });
    td.appendChild(fam);
    if (spec.size) {
      td.appendChild(makeNumberBox({ part, kind: 'size', min: spec.min, max: spec.max, value: p.size,
        dflt: () => spec.size, placeholder: String(spec.size) }));
      td.appendChild(document.createTextNode(' px'));
    }
    const x = document.createElement('button'); x.type = 'button'; x.textContent = '既定'; x.title = 'この部分の名前と大きさを、既定に戻す';
    x.style.marginLeft = '6px'; x.onclick = () => resetPart(part);
    td.appendChild(x); tr.appendChild(td);
    const tdX = document.createElement('td'), sm = document.createElement('span');
    sm.dataset.sample = part; sm.textContent = 'あいう Abc'; tdX.appendChild(sm); tr.appendChild(tdX);
    table.appendChild(tr);
    if (part === 'head') {              // 見出し: H1〜H4 それぞれの大きさ。空欄は本文に対する既定の比率
      const r2 = document.createElement('tr'), th2 = document.createElement('th');
      th2.textContent = '見出しの大きさ(px)'; th2.style.fontWeight = '400'; th2.style.fontSize = '12px'; r2.appendChild(th2);
      const td2 = document.createElement('td'); td2.colSpan = 2;
      const hs = p.sizes || {}, names = { h1: '2倍', h2: '1.5倍', h3: '1.17倍', h4: '1倍' };
      for (const l of ['h1', 'h2', 'h3', 'h4']) {
        const lab = document.createElement('span'); lab.textContent = l.toUpperCase() + ' ';
        lab.style.margin = l === 'h1' ? '0 2px 0 0' : '0 2px 0 8px';
        td2.appendChild(lab);
        td2.appendChild(makeNumberBox({ part: 'head', kind: 'hsize', level: l, min: 8, max: 120, value: hs[l],
          dflt: () => Math.round((fontPref('body').size || FONT_PARTS.body.size) * HEAD_DEFAULT_RATIO[l]),
          placeholder: names[l], title: l.toUpperCase() + ' の大きさ(px)。空欄は本文に対する既定の比率（' + names[l] + '）' }));
      }
      r2.appendChild(td2); table.appendChild(r2);
    }
  }
  refreshSamples();
}

async function openFontDlg() {
  buildFontRows();
  $('fveil').hidden = false;
  if (!fontListLoaded) {
    fontListLoaded = true;
    try {
      const names = await api.list_fonts(), dl = $('fontlist');
      for (const n of names) { const o = document.createElement('option'); o.value = n; dl.appendChild(o); }
    } catch (e) { /* 一覧が取れなくても、名前は直接入力できる */ }
  }
}
async function redrawKeepingPosition() {   // 図は描き直さないと変わらない。読んでいる位置は保つ
  if (!current) return;
  const top = $('scroll').scrollTop;
  await openFile(current);
  $('scroll').scrollTop = top;
}
async function onFontInput(e) {
  const t = e.target; if (!t.dataset || !t.dataset.part) return;
  const part = t.dataset.part, spec = FONT_PARTS[part], cur = { ...fontPref(part) };
  if (t.dataset.kind === 'family') cur.family = cssFamily(t.value).replace(/"/g, '');
  else if (t.dataset.kind === 'hsize') {
    const n = Math.round(parseFloat(t.value)), sizes = { ...(cur.sizes || {}) };
    if (isFinite(n)) sizes[t.dataset.level] = Math.min(120, Math.max(8, n)); else delete sizes[t.dataset.level];
    t.value = sizes[t.dataset.level] || ''; cur.sizes = sizes;
  } else {
    const n = Math.round(parseFloat(t.value));
    cur.size = isFinite(n) ? Math.min(spec.max, Math.max(spec.min, n)) : 0;
    t.value = cur.size || '';
  }
  prefs.fonts = { ...prefs.fonts, [part]: cur };
  api.set_prefs({ fonts: prefs.fonts });
  applyFonts(); refreshSamples();
  if (part === 'diagram') await redrawKeepingPosition();
}
$('ftable').addEventListener('change', onFontInput);
$('btnFont').onclick = openFontDlg;
$('fClose').onclick = closeFontDlg;
$('fveil').addEventListener('mousedown', e => { if (e.target === $('fveil')) closeFontDlg(); });
$('fReset').onclick = async () => {
  prefs.fonts = {};
  api.set_prefs({ fonts: {} });
  applyFonts(); buildFontRows();
  await redrawKeepingPosition();
};

// --- 表示倍率 -------------------------------------------------------------
let zoom = 1, fitMode = false;
const Z_MIN = 0.1, Z_MAX = 5;

function setZoom(z, fit) {
  zoom = Math.min(Z_MAX, Math.max(Z_MIN, z));
  fitMode = !!fit;
  $('content').style.zoom = zoom;
  $('zVal').value = Math.round(zoom * 100);
  $('zFit').classList.toggle('active', fitMode);
  savePrefsSoon();
}

const overflowing = () => $('scroll').scrollWidth > $('scroll').clientWidth + 1;

function fitWidth() {                      // 横スクロールが要らない最大の倍率を探す
  setZoom(1, true);
  if (!overflowing()) return;
  let lo = Z_MIN, hi = 1;
  for (let i = 0; i < 9; i++) {
    const mid = (lo + hi) / 2;
    $('content').style.zoom = mid;
    if (overflowing()) hi = mid; else lo = mid;
  }
  setZoom(lo, true);
}

const zoomBy = f => setZoom(Math.round(zoom * f * 100) / 100, false);
$('zOut').onclick = () => zoomBy(1 / 1.1);
$('zIn').onclick = () => zoomBy(1.1);
$('z100').onclick = () => setZoom(1, false);
$('zFit').onclick = fitWidth;
$('zVal').onchange = () => {
  const v = parseFloat($('zVal').value);
  setZoom(isFinite(v) ? v / 100 : zoom, false);
};
$('scroll').addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1.1 : 1 / 1.1);
}, { passive: false });
let resizeTimer = null;
window.addEventListener('resize', () => {  // 全体表示のまま窓を広げ縮めしたら追従する
  if (!fitMode) return;
  clearTimeout(resizeTimer); resizeTimer = setTimeout(fitWidth, 120);
});

let lastSync = 0;
async function syncList() {
  if (!api || !folder || listTruncated || Date.now() - lastSync < 1000) return;   // 途中までの一覧は、前面に戻るたびに読み直さない（毎回、上限の時間がかかるため）
  lastSync = Date.now();
  const r = await api.list_files(folder);
  if (r.error) { showMsg(r.error); return; }
  showMsg('');
  listTruncated = !!r.truncated;
  if (JSON.stringify(r.files) !== JSON.stringify(files)) { files = r.files; renderList(); }
}
// ---- 確認・知らせのダイアログ。押したボタンの番号を返す（Esc は、最後のボタン。Enter は、primary のボタン）
function ask(title, text, buttons, extra) {
  return new Promise(resolve => {
    $('dTitle').textContent = title; $('dText').textContent = text;
    $('dExtra').textContent = ''; if (extra) $('dExtra').appendChild(extra);
    const box = $('dBtns'); box.textContent = '';
    const done = i => { $('veil').classList.remove('show'); document.removeEventListener('keydown', onKey, true); resolve(i); };
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(buttons.length - 1); }
      else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); done(buttons.findIndex(b => b.primary)); }
    }
    buttons.forEach((b, i) => {
      const el = document.createElement('button'); el.textContent = b.label;
      if (b.primary) el.className = 'primary';
      el.onclick = () => done(i); box.appendChild(el);
    });
    document.addEventListener('keydown', onKey, true);
    $('veil').classList.add('show');
    box.querySelector('.primary')?.focus();
  });
}

// ============================================================ HTML ファイルへの書き出し
// いま表示している文書を、1つで完結する HTML ファイル（ネットにつながらなくても、同じ見た目で開ける）に書き出す。
// 画面に描いた結果をそのまま使う: Mermaid・Vega-Lite は SVG、数式は KaTeX の HTML（スタイルとフォントも入れる）、画像は埋め込み済みのもの。
// 配色は、明るい配色（受け取る人の環境で、読めるようにするため）。スクリプトは入れない。
let exportingHtml = false;
const EXPORT_ROOT = '#content';
async function settleRender() {                           // 数式・図・グラフを描き終えるまで待つ（描けなかったものは、待たない）
  while (openBusy > 0) await new Promise(r => setTimeout(r, 100));      // 文書を開いている途中（描画を含む）は、終わるまで待つ
  // 念のため、画面の状態も見る（描き終わっていない数式・図・グラフのもとの記述が残っていないか）。描けずに、エラーの枠に入ったものは、待たない
  const pending = () => [...document.querySelectorAll(
    EXPORT_ROOT + ' .math:not(.typeset), ' + EXPORT_ROOT + ' pre.mermaid-src, ' + EXPORT_ROOT + ' pre > code.language-vega-lite, ' + EXPORT_ROOT + ' pre > code.language-vegalite')].filter(e => !e.closest('.diagram-error')).length;
  for (let i = 0; i < 100 && pending(); i++) await new Promise(r => setTimeout(r, 200));
}
// アプリ自身のスタイルから、本文（EXPORT_ROOT の中）に効いているものを集める。暗い配色・印刷用（@media）は含めない
function collectExportCss() {
  const out = [];
  for (const sheet of document.styleSheets) {
    let rules; try { rules = sheet.cssRules; } catch (e) { continue; }
    for (const r of rules) {
      if (r.type !== CSSRule.STYLE_RULE) continue;
      const sel = r.selectorText || '';
      if (sel === ':root' || sel.includes(EXPORT_ROOT)) out.push(r.cssText.split(EXPORT_ROOT).join('.md-body'));
    }
  }
  return out.join('\n');
}
const escHtml = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
async function buildExportHtml(title) {
  const clone = document.querySelector(EXPORT_ROOT).cloneNode(true), warnings = [];
  clone.querySelectorAll('mark.find-hit').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));      // 検索のハイライトは、入れない
  clone.querySelectorAll('[data-line]').forEach(e => e.removeAttribute('data-line'));
  clone.querySelectorAll('[data-src]').forEach(e => e.removeAttribute('data-src'));
  clone.querySelectorAll('.diagram').forEach(e => { e.style.minHeight = ''; if (!e.getAttribute('style')) e.removeAttribute('style'); });
  if (clone.querySelector('.diagram-error, .math-error')) warnings.push('描けなかった図・グラフ・数式があります（エラーの表示のまま入ります）');
  clone.querySelectorAll('a[href]').forEach(a => { if (/^https?:/i.test(a.getAttribute('href'))) { a.target = '_blank'; a.rel = 'noopener noreferrer'; } });
  const lost = [...clone.querySelectorAll('img')].map(i => i.getAttribute('src') || '').filter(s => s && !/^(data:|https?:)/i.test(s));
  if (lost.length) warnings.push(`画像を埋め込めませんでした（相対パスのまま）: ${lost.slice(0, 3).join('、')}${lost.length > 3 ? ' ほか' : ''}`);
  const katexCss = clone.querySelector('.katex') ? (await api.get_katex()).css : '';
  const css = collectExportCss();
  const html = '<!doctype html>\n<html lang="ja">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n'
    + '<meta name="generator" content="Handy Markdown Viewer v__APP_VERSION__">\n<title>' + escHtml(title) + '</title>\n<style>\n'
    + 'html { background: var(--bg); }\nbody { margin: 0; background: var(--bg); color: var(--fg); font: var(--body-size, 14px)/1.7 var(--body-font, "Yu Gothic UI", "Segoe UI", sans-serif); }\n'
    + '.md-body { max-width: 960px; margin: 0 auto; padding: 28px 36px 60px; box-sizing: border-box; }\n'
    + '@media print { body { background: #fff; } .md-body { max-width: none; padding: 0; } }\n'
    + css + '\n' + katexCss + '\n</style>\n</head>\n<body>\n<article class="md-body">\n' + clone.innerHTML + '\n</article>\n</body>\n</html>\n';
  return { html, warnings };
}
async function exportHtml() {
  if (exportingHtml) return;
  if (!current) { showMsg('書き出す文書がありません（先に文書を開いてください）'); return; }
  exportingHtml = true;
  try {
    
    await settleRender();
    const restore = await printBeforeDiagrams();          // 暗い配色の図を、明るい配色に描き直す（印刷と同じ）
    let built;
    try { built = await buildExportHtml((document.querySelector('#content h1') || {}).textContent || current.substring(current.lastIndexOf('\\') + 1).replace(/\.[^.]*$/, '')); } finally { if (restore) await restore(); }
    const path = await api.pick_html_path(current.substring(current.lastIndexOf('\\') + 1).replace(/\.[^.]*$/, '') + '.html', current.substring(0, current.lastIndexOf('\\')));
    if (!path) return;
    const r = await api.save_html(path, built.html);
    if (r.error) { showMsg(r.error); return; }
    const warn = built.warnings.length ? '\n\n※ ' + built.warnings.join('\n※ ') : '';
    const i = await ask('HTML に書き出しました', `${r.path}\n（${Math.round(r.bytes / 1024).toLocaleString()} KB。1つのファイルで、ネットにつながらなくても開けます）${warn}`,
      [{ label: 'ブラウザーで開く', primary: true }, { label: '閉じる' }]);
    if (i === 0) { const o = await api.open_exported_html(r.path); if (o.error) showMsg(o.error); }
  } finally { exportingHtml = false; }
}
// ---- 新しいウィンドウ（別のプロセス）。複数のウィンドウを使うための入口: 一覧・リンクの Ctrl+クリック、中クリック、右クリック、Ctrl+Shift+N
async function openInNewWindow(path) {
  const r = await api.open_in_new_window(path || null);
  if (r && r.error) showMsg(r.error); else note('新しいウィンドウで開きました');
}
function hideCtx() { $('ctx').hidden = true; }
function showCtx(x, y, items) {
  const m = $('ctx'); m.textContent = '';
  for (const it of items) {
    const b = document.createElement('button'); b.className = 'citem';
    const l = document.createElement('span'); l.textContent = it.label;
    const k = document.createElement('span'); k.className = 'ckey'; k.textContent = it.key || '';
    b.append(l, k);
    b.addEventListener('click', () => { hideCtx(); it.run(); });
    m.appendChild(b);
  }
  m.hidden = false;
  m.style.left = Math.max(4, Math.min(x, innerWidth - m.offsetWidth - 4)) + 'px';
  m.style.top = Math.max(4, Math.min(y, innerHeight - m.offsetHeight - 4)) + 'px';
}
document.addEventListener('mousedown', e => { if (!e.target.closest('#ctx')) hideCtx(); });
window.addEventListener('blur', hideCtx);

// ---- 自動更新: 開いているファイルが他のアプリで保存されたら、表示を作り直す
// 1秒ごとに、更新の目印（日時・大きさ）だけを見る。変わっても、次の確認でも同じ値になってから読む
// （書き込みの途中を読まないため）。読んでいる位置は保つ。印刷・フォントの設定を開いている間は、動かさない。
let curStamp = null, watchPending = null, watchBusy = false, watchMissing = false, autoReload = true, noteTimer = null;
const stampKey = s => s ? s.join(':') : '';
function note(text) {
  const m = $('msg'); m.textContent = text; m.hidden = !text; m.style.color = 'var(--muted)';
  clearTimeout(noteTimer);
  if (text) noteTimer = setTimeout(() => { if (m.textContent === text) { m.hidden = true; m.textContent = ''; m.style.color = ''; } }, 4000);
}
function renderAuto() { $('btnAuto').classList.toggle('active', autoReload); $('btnAuto').title = autoReload
  ? '自動更新: 入。開いているファイルが他のアプリで保存されたら、表示を自動で更新します（押すと切ります）'
  : '自動更新: 切。押すと、他のアプリでの保存を見つけて、表示を自動で更新します'; }
async function watchTick() {
  if (!autoReload || !api || !current || watchBusy || document.hidden || MdPrint.isOpen() || fontDlgOpen()) return;
  watchBusy = true;
  try {
    const now = await api.file_stamp(current);
    if (now === null) {                                          // 消された・移動された。表示はそのまま残す
      if (!watchMissing) { watchMissing = true; note('開いているファイルが見つかりません（削除または移動された可能性があります）。表示は、そのままです'); }
      return;
    }
    watchMissing = false;
    if (stampKey(now) === stampKey(curStamp)) { watchPending = null; return; }
    if (stampKey(now) !== stampKey(watchPending)) { watchPending = now; return; }   // 変わった。もう1回、同じ値か確かめてから読む
    const path = current;
    await openFile(path, true);
    if (current === path) note('更新しました ' + new Date().toLocaleTimeString());
  } finally { watchBusy = false; }
}
setInterval(watchTick, 1000);
$('btnAuto').onclick = () => { autoReload = !autoReload; renderAuto(); api.set_prefs({ auto_reload: autoReload }); if (autoReload) watchTick(); };
window.addEventListener('focus', () => { watchTick(); });
window.addEventListener('focus', syncList);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncList(); });

window.addEventListener('pywebviewready', async () => {
  api = window.pywebview.api;
  try { prefs = Object.assign(prefs, await api.get_prefs()); } catch (e) { /* 設定が読めなければ既定のまま */ }
  applyFonts();
  initBodySearch();
  autoReload = prefs.auto_reload !== false; renderAuto();
  if (prefs.side_hidden) toggleSide();
  if (prefs.zoom) setZoom(prefs.zoom.value, prefs.zoom.fit);
  prefsReady = true;
  await MdPrint.init({
    api, content: () => $('content'), name: fileName, path: () => current, hasDocument: () => !!current,
    beforePrint: printBeforeDiagrams,
    notify: t => { showMsg(t); setTimeout(() => showMsg(''), 4000); },
  });
  const init = await api.get_initial();
  if (init.error) showMsg(init.error);
  if (init.folder) await loadFolder(init.folder, !!init.file);
  if (init.file) { await openFile(init.file); return; }
  showEmpty();
  if (!init.folder && !init.error) await chooseFolder();   // 引数なし: 最初にフォルダーを尋ねる
});
</script>
